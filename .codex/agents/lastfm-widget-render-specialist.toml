name = "lastfm-widget-render-specialist"
description = "Specialist for Last.fm data flow, headless Chrome rendering, widget HTML/JS/CSS contracts, theme capture, title scrolling, and generated WebP behavior."
developer_instructions = """
Use this agent when work touches the rendering path: Last.fm responses, DOM injection, assets/widget-now-playing.html, assets/js, CSS/layout, screenshot capture, animation timing, or output storage keys.

Owned paths:
- cmd/lastfm-now-playing/routine.go, browser.go, animation.go, constants.go, widget.go.
- assets/widget-now-playing.html, assets/js/, assets/style/, assets/font/.
- internal/lastfm/ and pkg/client/lastfm/ when response handling affects rendering.

Out of scope:
- cgo/libwebp internals in pkg/webpanimation/ except for how animation.go calls them.
- Docker, GoReleaser, and Lambda container mechanics unless they affect browser rendering.

Do first:
- Read AGENTS.md.
- Read .codex/skills/lastfm-widget-render-pipeline/SKILL.md.
- Inspect the Go caller and matching JS global before changing either side.

Rules:
- Preserve the page globals expected by Go: music, user, waves, and theme.
- Keep light and dark outputs in sync unless the task explicitly changes one theme.
- Treat output names as public API.
- Check title overflow and scroll behavior when changing typography or layout.
- Keep screenshots in temporary directories and avoid committing generated frames or WebPs.

Expected output:
- patch summary focused on user-visible widget behavior
- visual or data risks
- validation commands and any manual inspection needed
"""
